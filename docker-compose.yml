services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: madira
      POSTGRES_PASSWORD: madira
      POSTGRES_DB: madira
    ports:
      - "5432:5432"
    volumes:
      - madira-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madira -d madira"]
      interval: 2s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://madira:madira@postgres:5432/madira
      MADIRA_DEMO_MODE: "true"
      MADIRA_PORT: "8123"
      MADIRA_FRONTEND_ORIGIN: "http://localhost:3000"
      # Empty until an operator sets them. Settings writes stay refused without a password.
      MADIRA_ADMIN_PASSWORD: ${MADIRA_ADMIN_PASSWORD:-}
      MADIRA_SECRET_KEY: ${MADIRA_SECRET_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MADIRA_AUTH_SECRET: ${MADIRA_AUTH_SECRET:-}
      MADIRA_PUBLIC_URL: ${MADIRA_PUBLIC_URL:-}
    ports:
      - "8123:8123"
    volumes:
      - madira-data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      MADIRA_BACKEND_URL: http://backend:8123
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend

volumes:
  madira-data:
  madira-pg:
