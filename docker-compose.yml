services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MADIRA_DEMO_MODE: "true"
      MADIRA_PORT: "8123"
      MADIRA_FRONTEND_ORIGIN: "http://localhost:3000"
    ports:
      - "8123:8123"
    volumes:
      - madira-data:/app/backend/data

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      MADIRA_BACKEND_URL: http://backend:8123
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend

volumes:
  madira-data:
